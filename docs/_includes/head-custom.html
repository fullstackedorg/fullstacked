<style>
    pre.mermaid {
        background: none;
        text-align: center;
    }
</style>
<script type="module">
    // Kramdown renders ```mermaid fences as highlighted code. Turn them into
    // mermaid blocks and draw them.
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

    for (const block of document.querySelectorAll(".language-mermaid")) {
        const target = block.tagName === "CODE" ? block.parentElement : block;
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = block.textContent;
        target.replaceWith(diagram);
    }

    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: "pre.mermaid" });
</script>
